<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Elsie B. Salazar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-shapes"><span></span><span></span><span></span><span></span><span></span><span></span></div>
<header>
  <nav>
    <a class="logo" href="index.html">Elsie B. Salazar</a>
    <ul><li><a href="index.html">Home</a></li><li><a href="about.html">About</a></li><li><a href="portfolio.html">Portfolio</a></li><li><a href="contact.html" class="active">Contact</a></li></ul>
  </nav>
</header>
<main>
  <h1 class="page-title">Contact Me</h1>
  <div class="underline"></div>
  <p class="subtitle">Have a question or want to work together? Send me a message.</p>
  <div class="contact-grid">
    <div class="panel info-card">
      <h3>Contact Information</h3>
      <div class="info-row"><div class="icon">✉️</div><div><strong>Email</strong><a href="mailto:salazarelsie388@gmail.com">salazarelsie388@gmail.com</a></div></div>
      <div class="info-row"><div class="icon">🎓</div><div><strong>Course</strong><span>Bachelor of Science in Information Technology</span></div></div>
      <div class="info-row"><div class="icon">📍</div><div><strong>Location</strong><span>Philippines</span></div></div>
    </div>
    <form class="form-card" action="#" method="post">
      <h3>Send a Message</h3>
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Your full name">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com">
      <label for="subject">Subject</label>
      <select id="subject" name="subject">
        <option>General Inquiry</option>
      </select>
      <label for="message">Message</label>
      <textarea id="message" name="message" placeholder="Write your message here..."></textarea>
      <button class="submit" type="submit">Send Message</button>
    </form>
  </div>
</main>
</body>
</html>
